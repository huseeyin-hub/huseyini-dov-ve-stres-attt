<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hüseyin'i Patakla Deluxe! (Stres Atma Oyunu) 🥊</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #2b1b17;
      background-image: radial-gradient(#4a2e26 15%, transparent 16%);
      background-size: 24px 24px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: 'VT323', monospace;
      color: #fed391;
    }
    .game-box {
      background: #fed391;
      border: 6px solid #b8531e;
      border-radius: 16px;
      box-shadow: inset 0 0 0 4px #e59952, 0 12px 30px rgba(0,0,0,0.6);
      max-width: 440px;
      width: 100%;
      padding: 20px;
      text-align: center;
      position: relative;
    }
    h1 {
      font-size: 26px;
      color: #b8531e;
      margin-bottom: 6px;
    }
    .sub-title {
      font-size: 18px;
      color: #6d3211;
      margin-bottom: 12px;
    }
    .score-board {
      display: flex;
      justify-content: space-around;
      background: #b8531e;
      color: #fff4d4;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 20px;
      margin-bottom: 16px;
      border: 2px solid #5c2c16;
    }
    .arena {
      position: relative;
      width: 250px;
      height: 250px;
      margin: 0 auto 16px auto;
      background: #fff4d4;
      border: 4px solid #b8531e;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 15px rgba(184, 83, 30, 0.3);
      cursor: crosshair;
      overflow: hidden;
    }
    .avatar-wrapper {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.05s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .avatar-wrapper:active {
      transform: scale(0.94);
    }
    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
      pointer-events: none;
      display: block;
    }
    .floating-effect {
      position: absolute;
      font-size: 32px;
      font-weight: bold;
      color: #d63031;
      pointer-events: none;
      animation: floatUp 0.6s ease-out forwards;
      z-index: 10;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-50px) scale(1.3); opacity: 0; }
    }
    .shake {
      animation: shakeAnim 0.2s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shakeAnim {
      10%, 90% { transform: translate3d(-3px, 0, 0) rotate(-4deg); }
      20%, 80% { transform: translate3d(4px, 0, 0) rotate(4deg); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0) rotate(-6deg); }
      40%, 60% { transform: translate3d(6px, 0, 0) rotate(6deg); }
    }
    .dialog-bubble {
      background: #fff4d4;
      border: 3px solid #b8531e;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 20px;
      color: #4a210f;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      box-shadow: inset 0 0 0 2px #e59952;
    }
    .weapon-selector {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .weapon-btn {
      background: #e59952;
      border: 2px solid #b8531e;
      color: #fff4d4;
      padding: 6px 12px;
      border-radius: 6px;
      font-family: 'VT323', monospace;
      font-size: 18px;
      cursor: pointer;
    }
    .weapon-btn.active {
      background: #b8531e;
      border-color: #5c2c16;
      box-shadow: 0 0 6px #5c2c16;
      transform: scale(1.05);
    }
    .photo-input-label {
      display: inline-block;
      font-size: 15px;
      color: #6d3211;
      text-decoration: underline;
      cursor: pointer;
      margin-top: 6px;
    }
    #photoInput {
      display: none;
    }
  </style>
</head>
<body>

  <div class="game-box">
    <h1>🥊 HÜSEYİN'İ DÖV & STRES AT! 🥊</h1>
    <div class="sub-title">İçindeki bütün birikmiş siniri boşaltma saati</div>

    <div class="score-board">
      <div>HASAR: <span id="hits">0</span></div>
      <div>ÖFKE SEVİYESİ: <span id="anger">0%</span></div>
    </div>

    <div class="weapon-selector">
      <button class="weapon-btn active" onclick="setWeapon('🥊', 10, this)">Boks Eldiveni</button>
      <button class="weapon-btn" onclick="setWeapon('🩴', 25, this)">Terlik</button>
      <button class="weapon-btn" onclick="setWeapon('🍳', 50, this)">Tava</button>
    </div>

    <div class="arena" id="arena" onclick="hitTarget(event)">
      <div class="avatar-wrapper" id="avatarBox">
        <img id="userPhoto" class="avatar-img" src="huseyin.jpg" alt="Hedef">
      </div>
    </div>

    <div class="dialog-bubble" id="dialog">
      "Vur aşkım, darladığım her dakikanın hesabını sor, hakkındır!"
    </div>

    <div>
      <label class="photo-input-label" for="photoInput">📷 Başka Fotoğraf Seçmek İçin Tıkla</label>
      <input type="file" id="photoInput" accept="image/*" onchange="loadPhoto(event)">
    </div>
  </div>

  <script>
    let hitCount = 0;
    let currentWeapon = '🥊';
    let currentDamage = 10;
    const lines = [
      "Ah! Haklısın, darlamayacaktım!",
      "Tava çok ağırmış balım... ama hak ettim!",
      "Özür dilerim valla bir daha savunmaya geçmicem!",
      "Tamam hak ettim, vur askim rahatla!",
      "Darlayan tarafım nakavt oldu bile!",
      "Kafamda kuşlar uçuşuyor şu an!",
      "Envanterimdeki bütün canlar gitti ama helal olsun!"
    ];

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function setWeapon(icon, dmg, btn) {
      currentWeapon = icon;
      currentDamage = dmg;
      document.querySelectorAll('.weapon-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function hitTarget(e) {
      hitCount++;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(160, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.12);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch(err){}

      document.getElementById('hits').innerText = hitCount;
      
      let anger = Math.max(0, 100 - (hitCount * 5));
      document.getElementById('anger').innerText = anger + '%';

      const avatarBox = document.getElementById('avatarBox');
      avatarBox.classList.remove('shake');
      void avatarBox.offsetWidth;
      avatarBox.classList.add('shake');

      const arena = document.getElementById('arena');
      const floatText = document.createElement('div');
      floatText.className = 'floating-effect';
      floatText.innerText = currentWeapon + ' -' + currentDamage;
      
      const rect = arena.getBoundingClientRect();
      floatText.style.left = (e.clientX - rect.left - 20) + 'px';
      floatText.style.top = (e.clientY - rect.top - 20) + 'px';
      arena.appendChild(floatText);
      setTimeout(() => floatText.remove(), 600);

      const randomLine = lines[Math.floor(Math.random() * lines.length)];
      document.getElementById('dialog').innerText = `"${randomLine}"`;
    }

    function loadPhoto(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('userPhoto').src = e.target.result;
        }
        reader.readAsDataURL(file);
      }
    }
  </script>
</body>
</html>
